<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled - Clippster</title>
  <style>
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.145 0 0);
      --primary: oklch(0.985 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --warning: oklch(0.708 0.17 60);
      --warning-bg: oklch(0.269 0.05 60);
      --radius: 0.625rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      padding: 1.5rem;
    }

    .container {
      max-width: 28rem;
      width: 100%;
      animation: fadeIn 0.5s ease-out;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: calc(var(--radius) * 2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, transparent 50%, rgba(234, 179, 8, 0.05) 100%);
      pointer-events: none;
    }

    .content {
      position: relative;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: var(--warning-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease-out;
    }

    .icon-container svg {
      width: 40px;
      height: 40px;
      color: var(--warning);
    }

    @keyframes scaleIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--warning);
    }

    p {
      font-size: 0.9375rem;
      color: var(--muted-foreground);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .status {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .close-notice {
      margin-top: 1.5rem;
      font-size: 0.8125rem;
      color: var(--muted-foreground);
      opacity: 0.7;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .logo img:first-child {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .logo img:last-child {
      height: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/logo-icon.svg" alt="Clippster" width="32" height="32">
      <img src="/logo.svg" alt="Clippster" height="20">
    </div>
    <div class="card">
      <div class="gradient-overlay"></div>
      <div class="content">
        <div class="icon-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        </div>

        <h1>Payment Cancelled</h1>
        <p>Your payment was cancelled. No charges were made to your account.</p>

        <div class="status" id="status">
          Redirecting you back...
        </div>

        <p class="close-notice">You will be redirected shortly.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect back to billing page
      setTimeout(() => {
        window.location.href = '/organization/billing';
      }, 2000);
    });
  </script>
</body>
</html>
