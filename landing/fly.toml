# fly.toml app configuration file generated for clippster-landing on 2025-12-27T23:52:11-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clippster-landing'
primary_region = 'iad'

# Build context, dockerfile, and ignorefile are set on the flyctl CLI so the
# monorepo root is the context while Dockerfile stays under landing/.
# See: fly deploy . --config landing/fly.toml --dockerfile landing/Dockerfile
[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[env]
  API_URL = 'https://api.clippster.app/api'
  SITE_URL = 'https://clippster.app'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
