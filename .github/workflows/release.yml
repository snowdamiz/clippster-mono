name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  RELEASES_REPO: snowdamiz/clippster-releases

jobs:
  # First, create a draft release in the public repo
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' client/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release in Public Repo
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Check if release already exists
          if gh release view "v$VERSION" --repo $RELEASES_REPO > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, deleting it first..."
            gh release delete "v$VERSION" --repo $RELEASES_REPO --yes || true
            # Also delete the tag
            gh api --method DELETE "/repos/$RELEASES_REPO/git/refs/tags/v$VERSION" || true
          fi
          
          # Create new draft release
          gh release create "v$VERSION" \
            --repo $RELEASES_REPO \
            --title "Clippster v$VERSION" \
            --notes "See assets to download and install." \
            --draft

  # Build for each platform
  build-tauri:
    needs: create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact_suffix: aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact_suffix: x64
          - platform: windows-latest
            args: ""
            artifact_suffix: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend dependencies
        run: yarn install
        working-directory: client

      - name: Build frontend with production API URL
        run: |
          echo "Building frontend with VITE_API_URL=$VITE_API_URL"
          yarn build:ci
        working-directory: client
        shell: bash
        env:
          VITE_API_URL: https://clippster-server.fly.dev

      - name: Check signing key availability
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "✓ TAURI_SIGNING_PRIVATE_KEY is set (length: ${#TAURI_SIGNING_PRIVATE_KEY})"
          else
            echo "✗ TAURI_SIGNING_PRIVATE_KEY is NOT set - updater artifacts will NOT be created!"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: https://clippster-server.fly.dev
          # Updater signing key - required for creating .nsis.zip and .app.tar.gz
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (for .exe)
          TAURI_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: client
          includeUpdaterJson: true
          args: ${{ matrix.args }}
          retryAttempts: 3

      - name: Upload artifacts to public releases repo (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
          ARCH_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          echo "=== Debug: Listing all bundle files ==="
          find client/src-tauri/target -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) 2>/dev/null || true
          echo "=== End debug listing ==="
          
          # Find and upload DMG (should be unique per architecture build)
          DMG_FILE=$(find client/src-tauri/target -name "*.dmg" -type f | head -1)
          if [ -n "$DMG_FILE" ]; then
            echo "Uploading DMG: $DMG_FILE"
            gh release upload "v$VERSION" "$DMG_FILE" --repo $RELEASES_REPO --clobber
          else
            echo "WARNING: No DMG file found!"
          fi
          
          # Find and upload .app.tar.gz (for updater) - rename to include architecture
          APP_TAR=$(find client/src-tauri/target -name "*.app.tar.gz" -type f | head -1)
          if [ -n "$APP_TAR" ]; then
            # Rename to include architecture suffix to avoid overwrites
            BASENAME=$(basename "$APP_TAR")
            NEW_NAME="${BASENAME%.app.tar.gz}_${ARCH_SUFFIX}.app.tar.gz"
            cp "$APP_TAR" "/tmp/$NEW_NAME"
            echo "Uploading app tar as: $NEW_NAME"
            gh release upload "v$VERSION" "/tmp/$NEW_NAME" --repo $RELEASES_REPO --clobber
          else
            echo "WARNING: No .app.tar.gz file found!"
          fi
          
          # Find and upload .app.tar.gz.sig (signature for updater)
          APP_SIG=$(find client/src-tauri/target -name "*.app.tar.gz.sig" -type f | head -1)
          if [ -n "$APP_SIG" ]; then
            # Rename to include architecture suffix
            BASENAME=$(basename "$APP_SIG")
            NEW_NAME="${BASENAME%.app.tar.gz.sig}_${ARCH_SUFFIX}.app.tar.gz.sig"
            cp "$APP_SIG" "/tmp/$NEW_NAME"
            echo "Uploading app signature as: $NEW_NAME"
            gh release upload "v$VERSION" "/tmp/$NEW_NAME" --repo $RELEASES_REPO --clobber
          else
            echo "WARNING: No .app.tar.gz.sig file found!"
          fi

      - name: Upload artifacts to public releases repo (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          Write-Host "=== Debug: Listing all bundle files ==="
          Get-ChildItem -Path "client/src-tauri/target" -Recurse -Include "*.exe","*.msi","*.zip","*.sig" | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== End debug listing ==="
          
          # Find and upload NSIS installer
          $exeFile = Get-ChildItem -Path "client/src-tauri/target" -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if ($exeFile) {
            Write-Host "Uploading EXE: $($exeFile.FullName)"
            gh release upload "v$env:VERSION" "$($exeFile.FullName)" --repo $env:RELEASES_REPO --clobber
          } else {
            Write-Host "WARNING: No setup.exe file found!"
          }
          
          # Find and upload MSI
          $msiFile = Get-ChildItem -Path "client/src-tauri/target" -Recurse -Filter "*.msi" | Select-Object -First 1
          if ($msiFile) {
            Write-Host "Uploading MSI: $($msiFile.FullName)"
            gh release upload "v$env:VERSION" "$($msiFile.FullName)" --repo $env:RELEASES_REPO --clobber
          } else {
            Write-Host "WARNING: No MSI file found!"
          }
          
          # Find and upload nsis.zip (for updater) - try multiple patterns
          $nsisZip = Get-ChildItem -Path "client/src-tauri/target" -Recurse -Filter "*.nsis.zip" | Select-Object -First 1
          if ($nsisZip) {
            Write-Host "Uploading NSIS zip: $($nsisZip.FullName)"
            gh release upload "v$env:VERSION" "$($nsisZip.FullName)" --repo $env:RELEASES_REPO --clobber
          } else {
            Write-Host "WARNING: No .nsis.zip file found! Auto-updates will NOT work on Windows."
            Write-Host "This usually means TAURI_SIGNING_PRIVATE_KEY is not set or invalid."
          }
          
          # Find and upload nsis.zip.sig (signature for updater)
          $nsisSig = Get-ChildItem -Path "client/src-tauri/target" -Recurse -Filter "*.nsis.zip.sig" | Select-Object -First 1
          if ($nsisSig) {
            Write-Host "Uploading NSIS signature: $($nsisSig.FullName)"
            gh release upload "v$env:VERSION" "$($nsisSig.FullName)" --repo $env:RELEASES_REPO --clobber
          } else {
            Write-Host "WARNING: No .nsis.zip.sig file found!"
          }

      - name: Upload latest.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.artifact_suffix }}
          path: client/src-tauri/target/**/latest.json
          if-no-files-found: ignore

  # Merge latest.json files and publish release
  finalize-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download all latest.json artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: latest-json-*
          merge-multiple: true

      - name: Find and merge latest.json
        id: merge_json
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "Looking for latest.json files..."
          find . -name "latest.json" -type f
          
          # Find all latest.json files
          JSON_FILES=$(find . -name "latest.json" -type f)
          
          if [ -z "$JSON_FILES" ]; then
            echo "No latest.json files found"
            exit 0
          fi
          
          # Use jq to merge all platforms into one latest.json
          # Each file has structure: { version, notes, pub_date, platforms: {...} }
          echo '{}' > merged.json
          
          for file in $JSON_FILES; do
            echo "Processing: $file"
            cat "$file"
            echo ""
            
            # Merge platforms
            jq -s '.[0] * {platforms: (.[0].platforms + .[1].platforms)} | 
                   if .[1].version then .version = .[1].version else . end |
                   if .[1].notes then .notes = .[1].notes else . end |
                   if .[1].pub_date then .pub_date = .[1].pub_date else . end' \
                   merged.json "$file" > tmp.json && mv tmp.json merged.json
          done
          
          # Update URLs to point to public releases repo
          sed -i "s|snowdamiz/clippster-mono|$RELEASES_REPO|g" merged.json
          
          # Fix macOS URLs to use architecture-specific filenames
          # darwin-aarch64 should point to *_aarch64.app.tar.gz
          # darwin-x86_64 should point to *_x64.app.tar.gz
          jq --arg version "$VERSION" '
            .platforms["darwin-aarch64"].url |= gsub("\\.app\\.tar\\.gz$"; "_aarch64.app.tar.gz") |
            .platforms["darwin-x86_64"].url |= gsub("\\.app\\.tar\\.gz$"; "_x64.app.tar.gz")
          ' merged.json > tmp.json && mv tmp.json merged.json
          
          echo "Final merged latest.json:"
          cat merged.json

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if [ -f merged.json ]; then
            mv merged.json latest.json
            echo "Uploading latest.json..."
            gh release upload "v$VERSION" latest.json --repo $RELEASES_REPO --clobber
          fi

      - name: Publish release (remove draft status)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          gh release edit "v$VERSION" --repo $RELEASES_REPO --draft=false
