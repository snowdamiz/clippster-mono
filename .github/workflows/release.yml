name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  RELEASES_REPO: snowdamiz/clippster-releases

jobs:
  # First, create a draft release and build frontend (shared across all platforms)
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' client/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release in Public Repo
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo $RELEASES_REPO > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, deleting it first..."
            gh release delete "v$VERSION" --repo $RELEASES_REPO --yes || true
            gh api --method DELETE "/repos/$RELEASES_REPO/git/refs/tags/v$VERSION" || true
          fi
          gh release create "v$VERSION" \
            --repo $RELEASES_REPO \
            --title "Clippster v$VERSION" \
            --notes "See assets to download and install." \
            --draft

      # Build frontend once and share across all platform builds
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install and build frontend
        working-directory: client
        env:
          VITE_API_URL: https://clippster-server.fly.dev
        run: |
          yarn install
          yarn build:ci

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist
          retention-days: 1

  # Deploy server to Fly.io
  deploy-server:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Server to Fly.io
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SERVER_TOKEN }}
        run: flyctl deploy --remote-only

  # Deploy landing site to Fly.io
  deploy-landing:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Landing to Fly.io
        working-directory: landing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LANDING_TOKEN }}
        run: flyctl deploy --remote-only

  # Build for each platform
  build-tauri:
    needs: create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact_suffix: aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact_suffix: x64
          - platform: windows-latest
            args: --bundles nsis
            artifact_suffix: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          shared-key: ${{ matrix.platform }}-${{ matrix.artifact_suffix }}

      - name: Install frontend dependencies (for tauri build)
        run: yarn install
        working-directory: client

      - name: Install pumpfun-service dependencies
        run: yarn install
        working-directory: client/src-tauri/pumpfun-service

      - name: Build remotion-renderer sidecar
        working-directory: client/src-tauri/sidecars/remotion-renderer
        run: |
          yarn install
          yarn build

      # Download sidecar binaries (ffmpeg, node, yt-dlp) before Tauri build
      # build.rs will skip downloading since files already exist
      - name: Download sidecar binaries (macOS)
        if: contains(matrix.platform, 'macos')
        run: |
          BINARIES_DIR="client/src-tauri/binaries"
          mkdir -p "$BINARIES_DIR"

          # Determine target arch from matrix args
          if echo "${{ matrix.args }}" | grep -q "aarch64"; then
            ARCH="aarch64"
            NODE_ARCH="arm64"
            FFMPEG_ARCH="arm64"
          else
            ARCH="x86_64"
            NODE_ARCH="x64"
            FFMPEG_ARCH="x64"
          fi
          TRIPLE="${ARCH}-apple-darwin"

          echo "=== Downloading sidecar binaries for $TRIPLE ==="

          # --- FFmpeg ---
          FFMPEG_TARGET="$BINARIES_DIR/ffmpeg-${TRIPLE}"
          if [ ! -f "$FFMPEG_TARGET" ]; then
            echo "Downloading ffmpeg for darwin-${FFMPEG_ARCH}..."
            curl -fSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-${FFMPEG_ARCH}" -o "$FFMPEG_TARGET"
            chmod +x "$FFMPEG_TARGET"
          fi

          # --- yt-dlp ---
          YTDLP_TARGET="$BINARIES_DIR/yt-dlp-${TRIPLE}"
          if [ ! -f "$YTDLP_TARGET" ]; then
            echo "Downloading yt-dlp for darwin..."
            curl -fSL "https://github.com/yt-dlp/yt-dlp/releases/download/2025.12.08/yt-dlp_macos" -o "$YTDLP_TARGET"
            chmod +x "$YTDLP_TARGET"
          fi

          # --- Node (target arch) ---
          NODE_TARGET="$BINARIES_DIR/node-${TRIPLE}"
          if [ ! -f "$NODE_TARGET" ]; then
            echo "Downloading node v20.11.0 for darwin-${NODE_ARCH}..."
            curl -fSL "https://nodejs.org/dist/v20.11.0/node-v20.11.0-darwin-${NODE_ARCH}.tar.gz" -o /tmp/node.tar.gz
            tar -xzf /tmp/node.tar.gz -C /tmp
            cp "/tmp/node-v20.11.0-darwin-${NODE_ARCH}/bin/node" "$NODE_TARGET"
            chmod +x "$NODE_TARGET"
            rm -rf /tmp/node.tar.gz /tmp/node-v20.11.0-darwin-${NODE_ARCH}
          fi

          # --- Node (other platforms - build.rs downloads all variants) ---
          # Windows node
          WIN_NODE="$BINARIES_DIR/node-x86_64-pc-windows-msvc.exe"
          if [ ! -f "$WIN_NODE" ]; then
            echo "Downloading node for windows-x64..."
            curl -fSL "https://nodejs.org/dist/v20.11.0/node-v20.11.0-win-x64.zip" -o /tmp/node-win.zip
            unzip -o /tmp/node-win.zip "node-v20.11.0-win-x64/node.exe" -d /tmp
            cp "/tmp/node-v20.11.0-win-x64/node.exe" "$WIN_NODE"
            rm -rf /tmp/node-win.zip /tmp/node-v20.11.0-win-x64
          fi
          # macOS other arch node
          if [ "$ARCH" = "aarch64" ]; then
            OTHER_NODE="$BINARIES_DIR/node-x86_64-apple-darwin"
            OTHER_NODE_ARCH="x64"
          else
            OTHER_NODE="$BINARIES_DIR/node-aarch64-apple-darwin"
            OTHER_NODE_ARCH="arm64"
          fi
          if [ ! -f "$OTHER_NODE" ]; then
            echo "Downloading node for darwin-${OTHER_NODE_ARCH}..."
            curl -fSL "https://nodejs.org/dist/v20.11.0/node-v20.11.0-darwin-${OTHER_NODE_ARCH}.tar.gz" -o /tmp/node-other.tar.gz
            tar -xzf /tmp/node-other.tar.gz -C /tmp
            cp "/tmp/node-v20.11.0-darwin-${OTHER_NODE_ARCH}/bin/node" "$OTHER_NODE"
            chmod +x "$OTHER_NODE"
            rm -rf /tmp/node-other.tar.gz /tmp/node-v20.11.0-darwin-${OTHER_NODE_ARCH}
          fi
          # Linux node
          LINUX_NODE="$BINARIES_DIR/node-x86_64-unknown-linux-gnu"
          if [ ! -f "$LINUX_NODE" ]; then
            echo "Downloading node for linux-x64..."
            curl -fSL "https://nodejs.org/dist/v20.11.0/node-v20.11.0-linux-x64.tar.gz" -o /tmp/node-linux.tar.gz
            tar -xzf /tmp/node-linux.tar.gz -C /tmp
            cp "/tmp/node-v20.11.0-linux-x64/bin/node" "$LINUX_NODE"
            chmod +x "$LINUX_NODE"
            rm -rf /tmp/node-linux.tar.gz /tmp/node-v20.11.0-linux-x64
          fi

          echo "=== Sidecar binaries downloaded ==="
          ls -la "$BINARIES_DIR/"

      - name: Download sidecar binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $binDir = "client/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          # --- FFmpeg ---
          $ffmpegTarget = "$binDir/ffmpeg-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $ffmpegTarget)) {
            Write-Host "Downloading ffmpeg for windows-x64..."
            $zipPath = "$env:RUNNER_TEMP/ffmpeg.zip"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP/ffmpeg-extract" -Force
            $ffmpegExe = Get-ChildItem -Path "$env:RUNNER_TEMP/ffmpeg-extract" -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.FullName -notmatch "ffprobe|ffplay" } | Select-Object -First 1
            Copy-Item $ffmpegExe.FullName $ffmpegTarget
            Remove-Item -Recurse -Force "$env:RUNNER_TEMP/ffmpeg-extract", $zipPath
          }

          # --- yt-dlp ---
          $ytdlpTarget = "$binDir/yt-dlp-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $ytdlpTarget)) {
            Write-Host "Downloading yt-dlp for windows-x64..."
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2025.12.08/yt-dlp.exe" -OutFile $ytdlpTarget
          }

          # --- Node (windows) ---
          $nodeTarget = "$binDir/node-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $nodeTarget)) {
            Write-Host "Downloading node v20.11.0 for windows-x64..."
            $zipPath = "$env:RUNNER_TEMP/node.zip"
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.0/node-v20.11.0-win-x64.zip" -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP/node-extract" -Force
            Copy-Item "$env:RUNNER_TEMP/node-extract/node-v20.11.0-win-x64/node.exe" $nodeTarget
            Remove-Item -Recurse -Force "$env:RUNNER_TEMP/node-extract", $zipPath
          }

          # --- Node (other platforms - build.rs downloads all variants) ---
          # macOS aarch64
          $macArmNode = "$binDir/node-aarch64-apple-darwin"
          if (-not (Test-Path $macArmNode)) {
            Write-Host "Downloading node for darwin-arm64..."
            $tarPath = "$env:RUNNER_TEMP/node-mac-arm.tar.gz"
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.0/node-v20.11.0-darwin-arm64.tar.gz" -OutFile $tarPath
            tar -xzf $tarPath -C "$env:RUNNER_TEMP"
            Copy-Item "$env:RUNNER_TEMP/node-v20.11.0-darwin-arm64/bin/node" $macArmNode
            Remove-Item -Recurse -Force $tarPath, "$env:RUNNER_TEMP/node-v20.11.0-darwin-arm64"
          }
          # macOS x86_64
          $macX64Node = "$binDir/node-x86_64-apple-darwin"
          if (-not (Test-Path $macX64Node)) {
            Write-Host "Downloading node for darwin-x64..."
            $tarPath = "$env:RUNNER_TEMP/node-mac-x64.tar.gz"
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.0/node-v20.11.0-darwin-x64.tar.gz" -OutFile $tarPath
            tar -xzf $tarPath -C "$env:RUNNER_TEMP"
            Copy-Item "$env:RUNNER_TEMP/node-v20.11.0-darwin-x64/bin/node" $macX64Node
            Remove-Item -Recurse -Force $tarPath, "$env:RUNNER_TEMP/node-v20.11.0-darwin-x64"
          }
          # Linux x86_64
          $linuxNode = "$binDir/node-x86_64-unknown-linux-gnu"
          if (-not (Test-Path $linuxNode)) {
            Write-Host "Downloading node for linux-x64..."
            $tarPath = "$env:RUNNER_TEMP/node-linux.tar.gz"
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.0/node-v20.11.0-linux-x64.tar.gz" -OutFile $tarPath
            tar -xzf $tarPath -C "$env:RUNNER_TEMP"
            Copy-Item "$env:RUNNER_TEMP/node-v20.11.0-linux-x64/bin/node" $linuxNode
            Remove-Item -Recurse -Force $tarPath, "$env:RUNNER_TEMP/node-v20.11.0-linux-x64"
          }

          Write-Host "=== Sidecar binaries downloaded ==="
          Get-ChildItem $binDir

      # Sign native .node resource files for macOS notarization.
      # Tauri does NOT re-sign resource files, so this pre-signing is preserved.
      # Sidecar binaries (yt-dlp, node, ffmpeg) are signed by Tauri using
      # bundle.macOS.entitlements from tauri.conf.json - no pre-signing needed.
      - name: Sign native .node modules (macOS)
        if: contains(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Import Apple certificate into a temporary keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/native_signing_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/native-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          
          # Add to search list (prepend to existing keychains)
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s $KEYCHAIN_PATH $EXISTING_KEYCHAINS
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Find signing identity
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Using identity: $IDENTITY"
          
          # Sign all .node files in pumpfun-service/node_modules WITH entitlements.
          # These are RESOURCE files - Tauri's bundler does NOT re-sign resources,
          # so this pre-signing is preserved through the build and is required for
          # Apple notarization (all executable code must be signed).
          # The entitlements (disable-library-validation) are needed because Node.js
          # loads these via dlopen() which hardened runtime otherwise blocks.
          #
          # NOTE: sidecar binaries (yt-dlp, node, ffmpeg) are NOT pre-signed here.
          # Tauri re-signs all externalBin sidecars during tauri build using the
          # entitlements from tauri.conf.json bundle.macOS.entitlements.
          # Pre-signing them here would be overwritten by tauri-action anyway.
          NODE_ENTITLEMENTS="client/src-tauri/entitlements/node.entitlements.plist"
          find client/src-tauri/pumpfun-service/node_modules -name "*.node" -type f | while read file; do
            echo "Signing .node resource with entitlements: $file"
            codesign --force --options runtime --timestamp --entitlements "$NODE_ENTITLEMENTS" --sign "$IDENTITY" "$file"
          done

          echo "=== Native .node resources signed ==="

      # Install build tools for FFmpeg static compilation (ffmpeg-the-third crate with build feature)
      - name: Install FFmpeg build tools (macOS)
        if: contains(matrix.platform, 'macos')
        run: |
          # nasm is required for FFmpeg x86 assembly optimizations during source compilation
          brew install nasm pkg-config
          echo "Build tools installed: nasm=$(nasm -v 2>&1 | head -1), pkg-config=$(pkg-config --version)"

      # Cross-compile FFmpeg from source for x86_64 on ARM runner.
      # ffmpeg-sys-the-third's build-from-source doesn't handle macOS cross-compilation,
      # so we compile manually and use FFMPEG_DIR + static linking instead.
      - name: Cross-compile FFmpeg for x86_64 (macOS Intel)
        if: contains(matrix.platform, 'macos') && contains(matrix.args, 'x86_64')
        run: |
          FFMPEG_INSTALL="${{ github.workspace }}/client/src-tauri/ffmpeg-x86_64"
          FFMPEG_SRC="$RUNNER_TEMP/ffmpeg-src"

          git clone --depth 1 --branch n8.0 https://github.com/FFmpeg/FFmpeg.git "$FFMPEG_SRC"
          cd "$FFMPEG_SRC"

          ./configure \
            --prefix="$FFMPEG_INSTALL" \
            --arch=x86_64 \
            --enable-cross-compile \
            --target-os=darwin \
            --cc="clang -arch x86_64" \
            --extra-cflags="-arch x86_64" \
            --extra-ldflags="-arch x86_64" \
            --enable-static \
            --disable-shared \
            --disable-programs \
            --disable-doc \
            --disable-autodetect \
            --enable-pic \
            --disable-avdevice \
            --disable-avfilter

          make -j$(sysctl -n hw.ncpu)
          make install

          echo "FFmpeg x86_64 installed to: $FFMPEG_INSTALL"
          ls -la "$FFMPEG_INSTALL/lib/"

      # Skip frontend rebuild - dist is already pre-built with correct VITE_API_URL
      # Also remove ffmpeg-libs from resources on macOS (static linking = no dylibs to bundle)
      - name: Skip frontend rebuild (macOS)
        if: contains(matrix.platform, 'macos')
        run: |
          jq '.build.beforeBuildCommand = "" | .bundle.resources = [.bundle.resources[] | select(. != "ffmpeg-libs/*")]' client/src-tauri/tauri.conf.json > tmp.json && mv tmp.json client/src-tauri/tauri.conf.json

      # Install FFmpeg development libraries for Rust compilation (Windows)
      - name: Install FFmpeg dev libraries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ffmpegDevDir = "client/src-tauri/ffmpeg-dev"
          New-Item -ItemType Directory -Force -Path $ffmpegDevDir | Out-Null
          Write-Host "Downloading FFmpeg shared build for dev libraries..."
          $zipPath = "$env:RUNNER_TEMP/ffmpeg-shared.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.0-latest-win64-gpl-shared-8.0.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $ffmpegDevDir -Force
          Remove-Item $zipPath
          $extractedDir = Get-ChildItem $ffmpegDevDir -Directory | Select-Object -First 1
          Write-Host "FFmpeg dev libs installed at: $($extractedDir.FullName)"

          # Bundle FFmpeg shared libraries (DLLs) for runtime
          Write-Host "=== Bundling FFmpeg DLLs for runtime ==="
          $ffmpegLibsDir = "client/src-tauri/ffmpeg-libs"
          New-Item -ItemType Directory -Force -Path $ffmpegLibsDir | Out-Null

          # Copy all FFmpeg DLLs from bin directory
          $binDir = Get-ChildItem "$ffmpegDevDir" -Directory | Select-Object -First 1 | ForEach-Object { "$($_.FullName)/bin" }
          if (Test-Path $binDir) {
            Copy-Item "$binDir/*.dll" $ffmpegLibsDir -Force
            Write-Host "Bundled FFmpeg DLLs:"
            Get-ChildItem $ffmpegLibsDir
          } else {
            Write-Host "ERROR: FFmpeg bin directory not found at $binDir"
          }

      - name: Skip frontend rebuild (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $config = Get-Content client/src-tauri/tauri.conf.json | ConvertFrom-Json
          $config.build.beforeBuildCommand = ""
          $config | ConvertTo-Json -Depth 10 | Set-Content client/src-tauri/tauri.conf.json

      # Use tauri-action for all platforms (handles CLI installation efficiently)
      # macOS aarch64: native build, ffmpeg-sys-the-third compiles FFmpeg from source
      - name: Build Tauri App (macOS aarch64)
        if: contains(matrix.platform, 'macos') && contains(matrix.args, 'aarch64')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: client
          args: ${{ matrix.args }} --features ffmpeg-static

      # macOS x86_64: cross-compile, using prebuilt FFmpeg libs (ffmpeg-sys-the-third
      # can't cross-compile from ARM to x86_64 due to broken cross-prefix detection)
      - name: Build Tauri App (macOS x86_64)
        if: contains(matrix.platform, 'macos') && contains(matrix.args, 'x86_64')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FFMPEG_DIR: ${{ github.workspace }}/client/src-tauri/ffmpeg-x86_64
        with:
          projectPath: client
          args: ${{ matrix.args }} --features ffmpeg-static-prebuilt

      - name: Build Tauri App (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FFMPEG_DIR: ${{ github.workspace }}/client/src-tauri/ffmpeg-dev/ffmpeg-n8.0-latest-win64-gpl-shared-8.0
          FFMPEG_INCLUDE_DIR: ${{ github.workspace }}/client/src-tauri/ffmpeg-dev/ffmpeg-n8.0-latest-win64-gpl-shared-8.0/include
          FFMPEG_LIB_DIR: ${{ github.workspace }}/client/src-tauri/ffmpeg-dev/ffmpeg-n8.0-latest-win64-gpl-shared-8.0/lib
        with:
          projectPath: client
          args: ${{ matrix.args }}

      - name: Upload artifacts to public releases repo (macOS)
        if: contains(matrix.platform, 'macos')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
          ARCH_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          # Upload DMG
          DMG_FILE=$(find client/src-tauri/target -name "*.dmg" -type f | head -1)
          [ -n "$DMG_FILE" ] && gh release upload "v$VERSION" "$DMG_FILE" --repo $RELEASES_REPO --clobber
          
          # Upload .app.tar.gz (for updater) with architecture suffix
          APP_TAR=$(find client/src-tauri/target -name "*.app.tar.gz" -type f | head -1)
          if [ -n "$APP_TAR" ]; then
            BASENAME=$(basename "$APP_TAR")
            NEW_NAME="${BASENAME%.app.tar.gz}_${ARCH_SUFFIX}.app.tar.gz"
            cp "$APP_TAR" "/tmp/$NEW_NAME"
            gh release upload "v$VERSION" "/tmp/$NEW_NAME" --repo $RELEASES_REPO --clobber
            
            # Upload signature
            APP_SIG=$(find client/src-tauri/target -name "*.app.tar.gz.sig" -type f | head -1)
            if [ -n "$APP_SIG" ]; then
              SIG_NEW_NAME="${BASENAME%.app.tar.gz}_${ARCH_SUFFIX}.app.tar.gz.sig"
              cp "$APP_SIG" "/tmp/$SIG_NEW_NAME"
              gh release upload "v$VERSION" "/tmp/$SIG_NEW_NAME" --repo $RELEASES_REPO --clobber
            fi
          fi

      - name: Generate latest.json for macOS
        if: contains(matrix.platform, 'macos')
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARCH_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          PLATFORM_KEY=$( [ "$ARCH_SUFFIX" = "aarch64" ] && echo "darwin-aarch64" || echo "darwin-x86_64" )
          APP_SIG=$(find client/src-tauri/target -name "*.app.tar.gz.sig" -type f | head -1)
          SIGNATURE=$( [ -n "$APP_SIG" ] && cat "$APP_SIG" || echo "" )
          APP_TAR=$(find client/src-tauri/target -name "*.app.tar.gz" -type f | head -1)
          BASENAME=$(basename "$APP_TAR")
          NEW_NAME="${BASENAME%.app.tar.gz}_${ARCH_SUFFIX}.app.tar.gz"
          
          mkdir -p /tmp/latest-json
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See release notes on GitHub." \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg platform "$PLATFORM_KEY" \
            --arg signature "$SIGNATURE" \
            --arg url "https://github.com/$RELEASES_REPO/releases/download/v$VERSION/$NEW_NAME" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {($platform): {signature: $signature, url: $url}}}' \
            > /tmp/latest-json/latest.json

      - name: Upload artifacts to public releases repo (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          # Upload EXE installer
          $exeFile = Get-ChildItem -Path "client/src-tauri/target" -Recurse -File | Where-Object { $_.Name -like "*-setup.exe" } | Select-Object -First 1
          if ($exeFile) { gh release upload "v$env:VERSION" "$($exeFile.FullName)" --repo $env:RELEASES_REPO --clobber }
          
          # Upload signature
          $exeSig = Get-ChildItem -Path "client/src-tauri/target" -Recurse -File | Where-Object { $_.Name -like "*-setup.exe.sig" } | Select-Object -First 1
          if ($exeSig) { gh release upload "v$env:VERSION" "$($exeSig.FullName)" --repo $env:RELEASES_REPO --clobber }

      - name: Generate latest.json for Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          $exeFile = Get-ChildItem -Path "client/src-tauri/target" -Recurse -File | Where-Object { $_.Name -like "*-setup.exe" } | Select-Object -First 1
          $exeSig = Get-ChildItem -Path "client/src-tauri/target" -Recurse -File | Where-Object { $_.Name -like "*-setup.exe.sig" } | Select-Object -First 1
          
          $signature = if ($exeSig) { (Get-Content $exeSig.FullName -Raw).Trim() } else { "" }
          $exeFileName = if ($exeFile) { $exeFile.Name } else { "" }
          
          $outputDir = "$env:RUNNER_TEMP/latest-json"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          
          @{
            version = $env:VERSION
            notes = "See release notes on GitHub."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/$env:RELEASES_REPO/releases/download/v$env:VERSION/$exeFileName"
              }
            }
          } | ConvertTo-Json -Depth 10 | Out-File -FilePath "$outputDir/latest.json" -Encoding utf8

      - name: Upload latest.json artifact (macOS)
        if: contains(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.artifact_suffix }}
          path: /tmp/latest-json/latest.json
          if-no-files-found: warn

      - name: Upload latest.json artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}\latest-json\latest.json
          if-no-files-found: warn

  # Merge latest.json files and publish release
  finalize-release:
    needs: [create-release, build-tauri, deploy-server, deploy-landing]
    runs-on: ubuntu-latest
    steps:
      - name: Download all latest.json artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: latest-json-*
          merge-multiple: false

      - name: Merge latest.json files
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          JSON_FILES=$(find . -name "latest.json" -type f)
          
          if [ -z "$JSON_FILES" ]; then
            echo "ERROR: No latest.json files found!"
            jq -n --arg v "$VERSION" --arg d "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
              '{version: $v, notes: "See release notes on GitHub.", pub_date: $d, platforms: {}}' > merged.json
            exit 0
          fi
          
          echo '{"platforms":{}}' > merged.json
          for file in $JSON_FILES; do
            jq -s '{version: (.[1].version // .[0].version), notes: (.[1].notes // .[0].notes), pub_date: (.[1].pub_date // .[0].pub_date), platforms: ((.[0].platforms // {}) + (.[1].platforms // {}))}' \
              merged.json "$file" > tmp.json && mv tmp.json merged.json
          done
          
          echo "Final merged latest.json:"
          cat merged.json

      - name: Upload latest.json and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mv merged.json latest.json
          gh release upload "v$VERSION" latest.json --repo $RELEASES_REPO --clobber
          gh release edit "v$VERSION" --repo $RELEASES_REPO --draft=false
