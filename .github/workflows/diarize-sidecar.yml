# Build PyInstaller diarize sidecars for all supported triples and upload to clippster-releases.
# Run once (or when bumping models/deps) so client/src-tauri/build.rs can download them during
# every `cargo build` / `yarn tauri dev` / release CI — same pattern as yt-dlp in build.rs.

name: Diarize sidecar

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match DIARIZE_RELEASE_TAG in client/src-tauri/build.rs)'
        required: true
        default: 'diarize-sidecar-v0.1.0'

env:
  RELEASES_REPO: snowdamiz/clippster-releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-latest
            asset_name: diarize-x86_64-pc-windows-msvc.exe
            built_rel: client/src-tauri/sidecars/diarize/dist/diarize.exe
          - runs-on: ubuntu-latest
            asset_name: diarize-x86_64-unknown-linux-gnu
            built_rel: client/src-tauri/sidecars/diarize/dist/diarize
          - runs-on: macos-15
            asset_name: diarize-aarch64-apple-darwin
            built_rel: client/src-tauri/sidecars/diarize/dist/diarize
          - runs-on: macos-15-intel
            asset_name: diarize-x86_64-apple-darwin
            built_rel: client/src-tauri/sidecars/diarize/dist/diarize

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          cd client/src-tauri/sidecars/diarize
          pip install --no-cache-dir -r requirements.txt pyinstaller

      - name: Build one-file diarize
        shell: bash
        run: |
          cd client/src-tauri/sidecars/diarize
          pyinstaller --clean --noconfirm diarize.spec
          ls -la dist/

      - name: Stage with GitHub asset filename
        shell: bash
        run: cp "${{ matrix.built_rel }}" "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      RELEASES_REPO: snowdamiz/clippster-releases
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: diarize-flat
          pattern: diarize-*
          merge-multiple: true

      - name: Verify and upload to releases repo
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          ls -la diarize-flat/
          n=$(find diarize-flat -type f | wc -l)
          if [ "$n" -ne 4 ]; then
            echo "Expected 4 diarize binaries, found $n"
            find diarize-flat -type f
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "Diarize sidecar ($TAG)" \
              --notes "PyInstaller bundles for Clippster speaker diarization. Consumed by client/src-tauri/build.rs."
          fi
          gh release upload "$TAG" diarize-flat/* --repo "$RELEASES_REPO" --clobber
