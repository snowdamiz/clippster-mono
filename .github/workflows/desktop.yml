name: Desktop app
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/actions/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release.yml'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build:ci

  hyperframes-sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client/src-tauri/sidecars/hyperframes-renderer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read bundled Node version
        id: node
        working-directory: .
        run: |
          echo "version=$(sed -n 's/^const NODE_VERSION: &str = "\(.*\)";/\1/p' client/src-tauri/build.rs)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: yarn
          cache-dependency-path: client/src-tauri/sidecars/hyperframes-renderer/yarn.lock
      - run: yarn install --production --frozen-lockfile
      - run: yarn test

  rust:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      # tauri-build validates the bundled resource globs, including the sidecar's node_modules.
      - name: Install hyperframes-renderer sidecar dependencies
        working-directory: client/src-tauri/sidecars/hyperframes-renderer
        run: yarn install --production --frozen-lockfile
      - name: Create frontend dist placeholder
        run: New-Item -ItemType Directory -Force -Path client/dist | Out-Null
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          shared-key: desktop-verify-windows
      - uses: ./.github/actions/setup-ffmpeg-windows
      - name: Cargo check
        working-directory: client/src-tauri
        run: cargo check --all-targets --locked
      - name: Cargo test
        working-directory: client/src-tauri
        run: cargo test --lib --locked

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - run: mix deps.get
      - run: mix test
