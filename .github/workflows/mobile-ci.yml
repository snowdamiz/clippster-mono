name: Mobile CI

on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @clippster/shared-types test
      - run: yarn workspace @clippster/api-client test
      - run: yarn mobile:typecheck
