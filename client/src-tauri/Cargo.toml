[package]
name = "clippster-ui"
version = "0.1.108"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# Static FFmpeg: compiles FFmpeg from source and links statically.
# Used in CI for native builds (macOS aarch64) to avoid runtime dylib dependencies.
# Local dev uses system FFmpeg (dynamic linking) for faster builds.
ffmpeg-static = ["ffmpeg-the-third/build"]
# Static linking against prebuilt FFmpeg libraries (via FFMPEG_DIR).
# Used for cross-compilation where ffmpeg-sys-the-third's build-from-source is broken.
ffmpeg-static-prebuilt = ["ffmpeg-the-third/static"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clippster_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = "0.6"
tar = "0.4"
xz2 = "0.1"
flate2 = "1"

[dependencies]
tauri = { version = "2.3.0", features = ["macos-private-api", "protocol-asset", "native-tls-vendored", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["full", "io-util", "process"] }
warp = "0.3"
once_cell = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
dirs = "5"
urlencoding = "2"
rand = "0.8"
base64 = "0.22"
futures = "0.3"
async-stream = "0.3"
regex = "1.10"
num_cpus = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# OTA Updates - must be in regular deps for tauri-build to find permissions
tauri-plugin-updater = { version = "2.3", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2.3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
log = "0.4"
# Text-to-image rendering for advanced text overlays (chat bubbles, gradients, glows)
resvg = "0.44"
# Video frame decoding for professional playback engine
# Using ffmpeg-the-third (actively maintained fork of ffmpeg-next)
ffmpeg-the-third = { version = "4.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
lru = "0.12"
image = "0.25"
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

# Patch ffmpeg-sys-the-third to include postproc removal fix for FFmpeg 8.0
# (crates.io v4.0.0 passes --disable-postproc which FFmpeg 8.0 no longer recognizes)
# Remove this patch once ffmpeg-sys-the-third > 4.0.0 is published
[patch.crates-io]
ffmpeg-sys-the-third = { git = "https://github.com/shssoichiro/ffmpeg-the-third.git", rev = "b4ec43b" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cargo_clippy)'] }
