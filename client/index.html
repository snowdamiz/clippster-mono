<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clippster</title>
    <!-- Google Fonts for Subtitles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Lato:wght@100;300;400;700;900&family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Nunito:wght@200;300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700;800&family=Oswald:wght@200;300;400;500;600;700&family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Early platform detection for CSS styling (e.g., rounded corners on macOS)
      // This runs before Vue mounts to ensure styles are applied immediately
      (function() {
        var platform = navigator.platform.toLowerCase();
        if (platform.includes('mac')) {
          document.documentElement.classList.add('platform-macos');
        } else if (platform.includes('win')) {
          document.documentElement.classList.add('platform-windows');
        } else if (platform.includes('linux')) {
          document.documentElement.classList.add('platform-linux');
        }
      })();
    </script>
    <style>
      /* Keep the native window readable before the frontend loads. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #0a0c10;
        color: #fafafa;
      }
      /* macOS rounded corners - applied early before Vue loads */
      html.platform-macos, html.platform-macos body {
        border-radius: 10px;
        overflow: hidden;
      }
      /* Matches LoadingScreen.vue so the splash is centered before Vue mounts. */
      .boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0c10;
      }
      .boot-screen__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .boot-screen__brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .boot-screen__mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }
      .boot-screen__wordmark {
        height: 28px;
        width: auto;
        filter: brightness(0) invert(1);
      }
      .boot-screen__track {
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.075);
      }
      .boot-screen__fill {
        width: 33%;
        height: 100%;
        border-radius: 999px;
        background: #38bdf8;
        animation: boot-slide 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .boot-screen__status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(310%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen__fill {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body class="dark">
    <div id="app">
      <div class="boot-screen" role="status" aria-live="polite" data-tauri-drag-region>
        <div class="boot-screen__content" style="pointer-events: none">
          <div class="boot-screen__brand">
            <img class="boot-screen__mark" src="/logo-titlebar.svg" alt="" />
            <img class="boot-screen__wordmark" src="/logo.svg" alt="Clippster" />
          </div>
          <div class="boot-screen__track">
            <div class="boot-screen__fill"></div>
          </div>
          <span class="boot-screen__status">Starting Clippster</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
