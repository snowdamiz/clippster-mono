<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Wallet - Clippster</title>
  <style>
    /* Mirrors client/src/styles/theme.css tokens (page is served standalone by the app's local auth server). */
    :root {
      --canvas: #0a0c10; --surface: #13161c; --surface-raised: #191c23; --line: rgba(255,255,255,0.085);
      --fg: #eef0f4; --fg-muted: #959dab; --fg-subtle: #697181; --brand: #38bdf8;
      --primary-bg: #eef0f4; --fg-on-light: #0b0d11;
      --success: #34d399; --danger: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--canvas); color: var(--fg); padding: 24px; }
    .container { width: 100%; max-width: 380px; }
    .card { background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 24px 64px -12px rgba(0,0,0,0.7); }
    .content { padding: 28px 24px 24px; }
    h1 { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); margin-bottom: 4px; }
    .subtitle { font-size: 13px; line-height: 20px; color: var(--fg-muted); }
    #connect-btn, #pay-btn { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 8px; background: var(--primary-bg); color: var(--fg-on-light); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color 0.15s ease, opacity 0.15s ease; }
    #connect-btn:hover:not(:disabled), #pay-btn:hover:not(:disabled) { background: #ffffff; }
    #connect-btn:disabled, #pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #connect-btn svg, #pay-btn svg { width: 18px; height: 18px; }
    .btn-inner { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .spinner { animation: spin 1s linear infinite; }
    .opacity-25 { opacity: 0.25; }
    .opacity-75 { opacity: 0.75; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .status { margin-top: 12px; font-size: 12px; color: var(--fg-muted); text-align: center; min-height: 0; }
    .message-box { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12px; line-height: 18px; display: none; border: 1px solid; }
    .error { color: var(--danger); background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.3); }
    .success { color: var(--success); background: rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.3); font-weight: 500; }
    .icon-container { display: flex; justify-content: center; margin-bottom: 16px; }
    .icon-wrapper { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.34); }
    .icon { width: 22px; height: 22px; color: var(--brand); }
    .text-center { text-align: center; margin-bottom: 20px; }
    .divider { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .info-text { font-size: 12px; color: var(--fg-subtle); text-align: center; }
    .info-link { color: var(--brand); text-decoration: none; }
    .info-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="content">
        <!-- Icon -->
        <div class="icon-container">
          <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9m18 0V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v3" />
            </svg>
          </div>
        </div>

        <!-- Title -->
        <div class="text-center">
          <h1>Connect your wallet</h1>
          <p class="subtitle">Sign in securely with your Phantom wallet to access Clippster</p>
        </div>

        <!-- Connect Button -->
        <button id="connect-btn">
          <div class="btn-inner">
            <svg id="wallet-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6.5 2h11c1.1 0 2 .9 2 2v16c0 1.1-.9 2-2 2h-11c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2zm0 2v16h11V4h-11zm2 2h7v2h-7V6zm0 4h7v2h-7v-2zm0 4h4v2h-4v-2z"/>
            </svg>
            <svg id="spinner" class="spinner" width="20" height="20" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="btn-text">Connect Phantom wallet</span>
          </div>
        </button>

        <!-- Status Messages -->
        <div id="status" class="status"></div>
        <div id="error" class="message-box error"></div>
        <div id="success" class="message-box success"></div>

        <!-- Info Section -->
        <div class="divider">
          <p class="info-text">
            Don't have Phantom? 
            <a href="https://phantom.app/" target="_blank" rel="noopener noreferrer" class="info-link">
              Download here
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Get API base URL from URL params (passed from Tauri app)
    const urlParams = new URLSearchParams(window.location.search);
    const API_BASE = urlParams.get('apiBase') || 'https://clippster-server.fly.dev';
    let provider = null;

    // Check for Phantom
    const getProvider = () => {
      if ('phantom' in window) {
        const provider = window.phantom?.solana;
        if (provider?.isPhantom) {
          return provider;
        }
      }
      return null;
    };

    // Update status
    const updateStatus = (message) => {
      document.getElementById('status').textContent = message;
    };

    const showError = (message) => {
      const errorEl = document.getElementById('error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      document.getElementById('success').style.display = 'none';
    };

    const showSuccess = (message) => {
      const successEl = document.getElementById('success');
      successEl.textContent = message;
      successEl.style.display = 'block';
      document.getElementById('error').style.display = 'none';
    };

    const setLoading = (loading, text = 'Connecting...') => {
      const btn = document.getElementById('connect-btn');
      const walletIcon = document.getElementById('wallet-icon');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');
      
      btn.disabled = loading;
      walletIcon.style.display = loading ? 'none' : 'block';
      spinner.style.display = loading ? 'block' : 'none';
      btnText.textContent = loading ? text : 'Connect Phantom wallet';
    };

    // Connect wallet flow
    document.getElementById('connect-btn').addEventListener('click', async () => {
      setLoading(true, 'Connecting...');

      try {
        provider = getProvider();

        if (!provider) {
          window.open('https://phantom.app/', '_blank');
          showError('Please install Phantom wallet extension and refresh this page');
          setLoading(false);
          return;
        }

        updateStatus('Connecting to Phantom...');

        // Connect to Phantom
        const resp = await provider.connect();
        const publicKey = resp.publicKey.toString();

        setLoading(true, 'Getting challenge...');
        updateStatus('Getting authentication challenge...');

        // Get challenge from server
        const challengeResponse = await fetch(`${API_BASE}/api/auth/challenge`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            client_id: localStorage.getItem('client_id') || crypto.randomUUID()
          })
        });

        if (!challengeResponse.ok) {
          throw new Error('Failed to get challenge from server');
        }

        const challengeData = await challengeResponse.json();
        const challenge = challengeData.challenge;

        // Construct message - must match server template exactly
        const message = `${challenge.domain} wants you to sign in with your Solana account:
${publicKey}

Nonce: ${challenge.nonce}
Issued At: ${challenge.timestamp}
Chain ID: mainnet-beta`;

        setLoading(true, 'Awaiting signature...');
        updateStatus('Please approve the signature request in Phantom...');

        // Request signature
        const encodedMessage = new TextEncoder().encode(message);
        const signedMessage = await provider.signMessage(encodedMessage, "utf8");

        updateStatus('Authentication successful!');

        // Convert signature to base58 format for backend
        const signatureArray = Array.from(signedMessage.signature);
        const signatureBase58 = btoa(String.fromCharCode(...signatureArray));

        // Send result to local callback server
        const authResult = {
          signature: signatureBase58,
          public_key: publicKey,
          message: message,
          nonce: challenge.nonce
        };

        try {
          const callbackResponse = await fetch('http://localhost:48274/auth-callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(authResult)
          });

          if (callbackResponse.ok) {
            setLoading(false);
            updateStatus('');
            showSuccess('✓ Authentication complete! Closing window...');
            document.getElementById('connect-btn').disabled = true;
            
            // Close the window after a short delay
            setTimeout(() => {
              window.close();
              
              // If window.close() fails (some browsers block it), show message
              setTimeout(() => {
                const successEl = document.getElementById('success');
                if (successEl.style.display !== 'none') {
                  successEl.textContent = '✓ Authentication complete! You can close this tab now.';
                }
              }, 500);
            }, 1500);
          } else {
            setLoading(false);
            showError('Failed to send auth result to app. Please try again.');
          }
        } catch (error) {
          console.error('Callback error:', error);
          setLoading(false);
          showError('Failed to communicate with app. Please ensure the app is running.');
        }

      } catch (error) {
        console.error('Auth error:', error);
        setLoading(false);
        showError(error.message || 'Authentication failed');
        updateStatus('');
      }
    });

    // Check for Phantom on load
    window.addEventListener('load', () => {
      provider = getProvider();
      if (!provider) {
        updateStatus('Phantom wallet not detected');
      }
    });
  </script>
</body>
</html>
