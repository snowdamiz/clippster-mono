<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Clippster</title>
  <style>
    /* Mirrors client/src/styles/theme.css tokens (page is served standalone). */
    :root { --canvas: #0a0c10; --surface: #13161c; --line: rgba(255,255,255,0.085); --fg: #eef0f4; --fg-muted: #959dab; --fg-subtle: #697181; --success: #34d399; --warning: #fbbf24; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--canvas); color: var(--fg); padding: 24px; }
    .container { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 20px; animation: fadeIn 0.3s ease-out; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo > :first-child { width: 24px; height: 24px; border-radius: 6px; }
    .logo > :last-child { height: 15px; width: auto; filter: brightness(0) invert(1); }
    .card { width: 100%; background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 24px 64px -12px rgba(0,0,0,0.7); padding: 28px 24px 24px; text-align: center; }
    .tile { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid; }
    .tile svg { width: 22px; height: 22px; }
    .tile--success { color: var(--success); background: rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.3); }
    .tile--warning { color: var(--warning); background: rgba(251,191,36,0.12); border-color: rgba(251,191,36,0.3); }
    h1 { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; }
    p { font-size: 13px; line-height: 20px; color: var(--fg-muted); }
    p + p { margin-top: 6px; }
    .status { margin-top: 18px; font-size: 12px; color: var(--fg-muted); padding: 9px 12px; background: rgba(255,255,255,0.045); border-radius: 8px; }
    .note { margin-top: 18px; font-size: 12px; color: var(--fg-subtle); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/logo-icon.svg" alt="Clippster" width="32" height="32">
      <img src="/logo.svg" alt="Clippster" height="20">
    </div>
    <div class="card">
      <div class="tile tile--success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
      <h1>Payment successful</h1>
      <p>Your credit pack was purchased and the credits have been added to your account.</p>
      <div class="status" id="status">Notifying the app…</div>
      <p class="note">You can close this window now.</p>
    </div>
  </div>

  <script>
    // The Tauri callback server will intercept this page load and emit the event
    // This page is just a confirmation for the user
    
    document.addEventListener('DOMContentLoaded', () => {
      const statusEl = document.getElementById('status');
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const returnTo = params.get('return_to');

      if (returnTo === 'mobile') {
        const qs = sessionId ? `?session_id=${encodeURIComponent(sessionId)}` : '';
        window.location.href = `clippster://stripe/success${qs}`;
        return;
      }
      
      // Update status after a short delay to show the app has been notified
      setTimeout(() => {
        statusEl.textContent = 'Clippster has been notified.';
        statusEl.style.color = 'var(--success)';
      }, 1000);
      
      // Try to close the window after a delay
      setTimeout(() => {
        window.close();
      }, 3000);
    });
  </script>
</body>
</html>
