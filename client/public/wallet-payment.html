<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Payment - Clippster</title>
  <style>
    /* Mirrors client/src/styles/theme.css tokens (page is served standalone by the app's local auth server). */
    :root {
      --canvas: #0a0c10; --surface: #13161c; --surface-raised: #191c23; --line: rgba(255,255,255,0.085);
      --fg: #eef0f4; --fg-muted: #959dab; --fg-subtle: #697181; --brand: #38bdf8;
      --primary-bg: #eef0f4; --fg-on-light: #0b0d11;
      --success: #34d399; --danger: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--canvas); color: var(--fg); padding: 24px; }
    .container { width: 100%; max-width: 380px; }
    .card { background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 24px 64px -12px rgba(0,0,0,0.7); }
    .content { padding: 28px 24px 24px; }
    h1 { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); margin-bottom: 4px; }
    .subtitle { font-size: 13px; line-height: 20px; color: var(--fg-muted); }
    #connect-btn, #pay-btn { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 8px; background: var(--primary-bg); color: var(--fg-on-light); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color 0.15s ease, opacity 0.15s ease; }
    #connect-btn:hover:not(:disabled), #pay-btn:hover:not(:disabled) { background: #ffffff; }
    #connect-btn:disabled, #pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #connect-btn svg, #pay-btn svg { width: 18px; height: 18px; }
    .btn-inner { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .spinner { animation: spin 1s linear infinite; }
    .opacity-25 { opacity: 0.25; }
    .opacity-75 { opacity: 0.75; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .status { margin-top: 12px; font-size: 12px; color: var(--fg-muted); text-align: center; min-height: 0; }
    .message-box { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12px; line-height: 18px; display: none; border: 1px solid; }
    .error { color: var(--danger); background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.3); }
    .success { color: var(--success); background: rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.3); font-weight: 500; }
    h1 { margin-bottom: 16px; }
    .payment-details { margin-bottom: 20px; border-radius: 12px; background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--line); }
    .detail-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; font-size: 13px; }
    .detail-row + .detail-row { border-top: 1px solid var(--line); }
    .detail-label { color: var(--fg-muted); }
    .detail-value { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="content">
        <h1>Complete payment</h1>

        <div class="payment-details">
          <div class="detail-row">
            <span class="detail-label">Package</span>
            <span class="detail-value" id="pack-name">-</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Hours</span>
            <span class="detail-value" id="pack-hours">-</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Amount (USD)</span>
            <span class="detail-value" id="pack-usd">-</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Amount (SOL)</span>
            <span class="detail-value" id="pack-sol">-</span>
          </div>
        </div>

        <button id="pay-btn">
          <svg id="wallet-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
          </svg>
          <svg id="spinner" class="spinner" width="20" height="20" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span id="btn-text">Pay with Phantom</span>
        </button>

        <div id="status" class="status"></div>
        <div id="error" class="message-box error"></div>
        <div id="success" class="message-box success"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script>
    // Get payment details from URL params
    const urlParams = new URLSearchParams(window.location.search);
    // Get API base URL from URL params (passed from Tauri app)
    const API_BASE = urlParams.get('apiBase') || 'https://api.clippster.app';
    const CALLBACK_PORT = 48275; // Different port from auth
    const paymentData = {
      packKey: urlParams.get('packKey'),
      packName: urlParams.get('packName'),
      hours: urlParams.get('hours'),
      usd: urlParams.get('usd'),
      sol: urlParams.get('sol'),
      companyWallet: urlParams.get('companyWallet'),
      authToken: urlParams.get('authToken'),
      rpcUrl: null // Will be fetched from API
    };

    // Display payment details
    document.getElementById('pack-name').textContent = paymentData.packName || '-';
    document.getElementById('pack-hours').textContent = paymentData.hours ? `${paymentData.hours} hours` : '-';
    document.getElementById('pack-usd').textContent = paymentData.usd ? `$${paymentData.usd}` : '-';
    document.getElementById('pack-sol').textContent = paymentData.sol ? `${parseFloat(paymentData.sol).toFixed(6)} SOL` : '-';

    const getProvider = () => {
      if ('phantom' in window) {
        const provider = window.phantom?.solana;
        if (provider?.isPhantom) {
          return provider;
        }
      }
      return null;
    };

    const updateStatus = (message) => {
      document.getElementById('status').textContent = message;
    };

    const showError = (message) => {
      const errorEl = document.getElementById('error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      document.getElementById('success').style.display = 'none';
    };

    const showSuccess = (message) => {
      const successEl = document.getElementById('success');
      successEl.textContent = message;
      successEl.style.display = 'block';
      document.getElementById('error').style.display = 'none';
    };

    const setLoading = (loading, text = 'Processing...') => {
      const btn = document.getElementById('pay-btn');
      const walletIcon = document.getElementById('wallet-icon');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');
      
      btn.disabled = loading;
      walletIcon.style.display = loading ? 'none' : 'block';
      spinner.style.display = loading ? 'block' : 'none';
      btnText.textContent = loading ? text : 'Pay with Phantom';
    };

    document.getElementById('pay-btn').addEventListener('click', async () => {
      setLoading(true, 'Loading...');

      try {
        // Fetch RPC URL if not already loaded
        if (!paymentData.rpcUrl) {
          updateStatus('Loading configuration...');
          const pricingResponse = await fetch(`${API_BASE}/api/pricing`);
          if (!pricingResponse.ok) {
            throw new Error('Failed to load configuration');
          }
          const pricingData = await pricingResponse.json();
          paymentData.rpcUrl = pricingData.rpc_url || 'https://api.mainnet-beta.solana.com';
        }

        setLoading(true, 'Connecting...');
        const provider = getProvider();

        if (!provider) {
          window.open('https://phantom.app/', '_blank');
          showError('Please install Phantom wallet extension and refresh this page');
          setLoading(false);
          return;
        }

        updateStatus('Connecting to Phantom...');

        // Connect to Phantom if not already connected
        if (!provider.isConnected) {
          await provider.connect();
        }

        const publicKey = provider.publicKey.toString();

        // Create transfer transaction
        updateStatus('Creating transaction...');
        setLoading(true, 'Creating transaction...');
        
        const connection = new solanaWeb3.Connection(paymentData.rpcUrl, 'confirmed');
        const fromPubkey = provider.publicKey;
        const toPubkey = new solanaWeb3.PublicKey(paymentData.companyWallet);
        
        const lamports = Math.floor(parseFloat(paymentData.sol) * solanaWeb3.LAMPORTS_PER_SOL);
        
        const transaction = new solanaWeb3.Transaction().add(
          solanaWeb3.SystemProgram.transfer({
            fromPubkey,
            toPubkey,
            lamports
          })
        );

        // Get recent blockhash
        transaction.feePayer = fromPubkey;
        const { blockhash } = await connection.getLatestBlockhash();
        transaction.recentBlockhash = blockhash;

        // Request signature from Phantom
        updateStatus('Please approve the transaction in Phantom...');
        setLoading(true, 'Awaiting signature...');
        const signedTransaction = await provider.signTransaction(transaction);

        // Send transaction
        updateStatus('Sending transaction...');
        setLoading(true, 'Sending transaction...');
        const signature = await connection.sendRawTransaction(signedTransaction.serialize());

        // Wait for confirmation
        updateStatus('Confirming transaction...');
        setLoading(true, 'Confirming...');
        await connection.confirmTransaction(signature, 'confirmed');

        updateStatus('Transaction confirmed!');

        // Send result to local callback server (include wallet address for verification)
        // Using snake_case to match Rust struct field names
        const paymentResult = {
          signature,
          pack_key: paymentData.packKey,
          auth_token: paymentData.authToken,
          from_address: publicKey,
          pack_hours: parseInt(paymentData.hours, 10)
        };

        try {
          const callbackResponse = await fetch(`http://localhost:${CALLBACK_PORT}/payment-callback`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(paymentResult)
          });

          if (callbackResponse.ok) {
            setLoading(false);
            updateStatus('');
            showSuccess('✓ Payment successful! Closing window...');
            document.getElementById('pay-btn').disabled = true;
            
            setTimeout(() => {
              window.close();
              
              setTimeout(() => {
                const successEl = document.getElementById('success');
                if (successEl.style.display !== 'none') {
                  successEl.textContent = '✓ Payment successful! You can close this tab now.';
                }
              }, 500);
            }, 1500);
          } else {
            setLoading(false);
            showError('Failed to send payment result to app. Please try again.');
          }
        } catch (error) {
          console.error('Callback error:', error);
          setLoading(false);
          showError('Failed to communicate with app. Please ensure the app is running.');
        }

      } catch (error) {
        console.error('Payment error:', error);
        setLoading(false);
        showError(error.message || 'Payment failed');
        updateStatus('');
      }
    });

    // Check for Phantom on load
    window.addEventListener('load', () => {
      const provider = getProvider();
      if (!provider) {
        updateStatus('Phantom wallet not detected');
        showError('Phantom wallet extension not found. Please install it to continue.');
      }
    });
  </script>
</body>
</html>
