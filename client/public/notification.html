<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      cursor: pointer;
    }

    .notification {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: #1a1a2e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      animation: slideIn 250ms cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 400px;
      margin: 0 auto;
    }

    .notification.closing {
      animation: fadeOut 150ms ease-out forwards;
    }

    .accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 12px 12px 0 0;
    }

    .accent--success { background: linear-gradient(90deg, #10b981, #34d399, #6ee7b7); }
    .accent--error { background: linear-gradient(90deg, #ef4444, #f87171, #fca5a5); }
    .accent--warning { background: linear-gradient(90deg, #f59e0b, #fbbf24, #fcd34d); }
    .accent--info { background: linear-gradient(90deg, #06b6d4, #0ea5e9, #38bdf8); }

    .icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon--success { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .icon--error { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .icon--warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .icon--info { background: rgba(6, 182, 212, 0.15); color: #06b6d4; }

    .icon svg { width: 20px; height: 20px; }

    .text { flex: 1; min-width: 0; padding-top: 2px; }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.4;
      letter-spacing: -0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .description {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-label {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(calc(100% + 1.5rem)) scale(0.95); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="notification" id="notification" onclick="focusMainWindow()">
    <div class="accent" id="accent"></div>
    <div class="icon" id="icon"></div>
    <div class="text">
      <div class="title" id="title"></div>
      <div class="description" id="description"></div>
      <div class="app-label">Clippster</div>
    </div>
  </div>

  <script>
    const icons = {
      success: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      error: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
      warning: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    };

    // Parse data from URL params
    const params = new URLSearchParams(window.location.search);
    const dataStr = params.get('data');
    let data = { title: 'Notification', description: '', type: 'info' };
    try {
      if (dataStr) data = JSON.parse(decodeURIComponent(dataStr));
    } catch (e) {
      console.error('Failed to parse notification data:', e);
    }

    const type = data.type || 'info';
    document.getElementById('accent').className = `accent accent--${type}`;
    document.getElementById('icon').className = `icon icon--${type}`;
    document.getElementById('icon').innerHTML = icons[type] || icons.info;
    document.getElementById('title').textContent = data.title || 'Notification';

    const descEl = document.getElementById('description');
    if (data.description) {
      descEl.textContent = data.description;
    } else {
      descEl.style.display = 'none';
    }

    // Click to focus main window
    async function focusMainWindow() {
      try {
        const { WebviewWindow } = await import('https://unpkg.com/@tauri-apps/api/webviewWindow');
        const mainWindow = WebviewWindow.getByLabel('main');
        if (mainWindow) {
          await mainWindow.setFocus();
        }
      } catch (e) {
        // Fallback: just close this window
      }
      try {
        const { getCurrentWindow } = await import('https://unpkg.com/@tauri-apps/api/window');
        const win = getCurrentWindow();
        await win.close();
      } catch (e) {}
    }
  </script>
</body>
</html>
