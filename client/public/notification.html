<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification</title>
  <style>
    /* Mirrors client/src/styles/theme.css tokens (this page is standalone). */
    :root {
      --surface-raised: #191c23;
      --line: rgba(255, 255, 255, 0.085);
      --fg: #eef0f4;
      --fg-muted: #959dab;
      --fg-subtle: #697181;
      --brand: #38bdf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: pointer;
    }

    .notification {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface-raised);
      border-radius: 12px;
      box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--line);
      animation: slideIn 220ms cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 400px;
      margin: 0 auto;
    }

    .notification.closing {
      animation: fadeOut 140ms ease-out forwards;
    }

    .icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon--success { color: var(--success); }
    .icon--error { color: var(--danger); }
    .icon--warning { color: var(--warning); }
    .icon--info { color: var(--brand); }

    .icon svg { width: 18px; height: 18px; }

    .text { flex: 1; min-width: 0; }

    .title {
      font-size: 13px;
      font-weight: 500;
      color: var(--fg);
      line-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .description {
      font-size: 12px;
      color: var(--fg-muted);
      line-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-label {
      font-size: 11px;
      color: var(--fg-subtle);
      margin-top: 4px;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="notification" id="notification" onclick="focusMainWindow()">
    <div class="icon" id="icon"></div>
    <div class="text">
      <div class="title" id="title"></div>
      <div class="description" id="description"></div>
      <div class="app-label">Clippster</div>
    </div>
  </div>

  <script>
    const icons = {
      success: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      error: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
      warning: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      info: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    };

    // Parse data from URL params
    const params = new URLSearchParams(window.location.search);
    const dataStr = params.get('data');
    let data = { title: 'Notification', description: '', type: 'info' };
    try {
      if (dataStr) data = JSON.parse(decodeURIComponent(dataStr));
    } catch (e) {
      console.error('Failed to parse notification data:', e);
    }

    const type = data.type || 'info';
    document.getElementById('icon').className = `icon icon--${type}`;
    document.getElementById('icon').innerHTML = icons[type] || icons.info;
    document.getElementById('title').textContent = data.title || 'Notification';

    const descEl = document.getElementById('description');
    if (data.description) {
      descEl.textContent = data.description;
    } else {
      descEl.style.display = 'none';
    }

    // Click to focus main window
    async function focusMainWindow() {
      try {
        const { WebviewWindow } = await import('https://unpkg.com/@tauri-apps/api/webviewWindow');
        const mainWindow = WebviewWindow.getByLabel('main');
        if (mainWindow) {
          await mainWindow.setFocus();
        }
      } catch (e) {
        // Fallback: just close this window
      }
      try {
        const { getCurrentWindow } = await import('https://unpkg.com/@tauri-apps/api/window');
        const win = getCurrentWindow();
        await win.close();
      } catch (e) {}
    }
  </script>
</body>
</html>
