app = "clippster-web"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  WEB_ORIGIN = "https://app.clippster.app"
  CLIPPSTER_API_URL = "https://api.clippster.app/api"
  WEB_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 100
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "web_data"
  destination = "/data"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[deploy]
  strategy = "immediate"
